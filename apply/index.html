<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Application | TenTwo Technologies</title>
<meta name="description" content="Apply for the TenTwo Technologies online internship program and continue to the official application form." />
<link rel="canonical" href="https://www.tentwotechnologies.com/apply/" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a2a5e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Logo pops in */
    .logo-wrap {
      animation: popIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .logo-wrap img {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    /* Company name fades in */
    .brand {
      animation: fadeUp 0.6s ease 0.5s both;
    }

    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .brand h1 {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand p {
      color: rgba(255,255,255,0.65);
      font-size: 0.9rem;
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    /* Progress bar */
    .progress-wrap {
      width: 220px;
      height: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      overflow: hidden;
      animation: fadeUp 0.6s ease 0.8s both;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a8aff, #7ab6ff);
      border-radius: 99px;
      animation: fillBar 3s ease-in-out 1s forwards;
    }

    @keyframes fillBar {
      0%   { width: 0%; }
      100% { width: 100%; }
    }

    /* Status text */
    .status {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      animation: fadeUp 0.6s ease 1s both;
    }

    /* Dots pulse */
    .dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
